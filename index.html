 {toast&&<div role="status" className="fixed bottom-5 left-1/2 z-[90] max-w-[90vw] -translate-x-1/2 rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white shadow-xl">{toast}</div>}
 <footer className="mx-auto max-w-7xl px-4 pb-8 text-center text-xs text-slate-400 sm:px-6">GalleryPass · Appointment operations prototype · Not for production client data</footer></div>
